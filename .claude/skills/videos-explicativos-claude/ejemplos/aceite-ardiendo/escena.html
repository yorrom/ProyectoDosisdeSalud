<script>
X.listo(() => {
  const $ = (id) => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
  const svg = $('mundo-svg');
  X.defs(svg); X.materiales(svg);
  const mk = (tag, attrs, padre) => { const e = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); if (padre) padre.appendChild(e); return e; };
  // azulejos tipo metro (ladrillo)
  for (let y = -1000, f = 0; y < 1100; y += 64, f++) for (let x = -900 + (f % 2) * 64; x < 2000; x += 128)
    mk('rect', { x: x + 3, y: y + 3, width: 122, height: 58, rx: 8, fill: f % 7 === 3 && x % 3 === 0 ? '#D9CDBE' : '#E8DFD2', opacity: 0.2 }, $('azulejos'));

  const A = {
    sarten: X.debe(X.en('sartén'), 'sartén'), explota: X.debe(X.en('explota'), 'explota'), porque: X.debe(X.en('por qué'), 'por qué'),
    arde: X.debe(X.en('arde'), 'arde'), grados: X.debe(X.en('grados'), 'grados'), densa: X.debe(X.en('densa'), 'densa'),
    hunde: X.debe(X.en('hunde'), 'hunde'), fondo: X.debe(X.en('fondo'), 'fondo'), hierve: X.debe(X.en('hierve'), 'hierve'),
    golpe: X.debe(X.en('golpe'), 'golpe'), vapor: X.debe(X.en('vapor'), 'vapor'), ocupa: X.debe(X.en('ocupa'), 'ocupa'),
    veces: X.debe(X.en('veces'), 'veces'), vapor2: X.debe(X.en('vapor', 2), 'vapor 2'), arriba: X.debe(X.en('arriba'), 'arriba'),
    piston: X.debe(X.en('pistón'), 'pistón'), gotas: X.debe(X.en('gotas'), 'gotas'), prende: X.debe(X.en('prende'), 'prende'),
    bola: X.debe(X.en('bola'), 'bola'), entonces: X.debe(X.en('entonces'), 'entonces'), apaga: X.debe(X.en('apaga'), 'apaga'),
    tapa: X.debe(X.en('tapa'), 'tapa'), muevas: X.debe(X.en('muevas'), 'muevas'), oxigeno: X.debe(X.en('oxígeno'), 'oxígeno'),

    // lupa sobre la gota en el fondo
    const lu = (t < A.fondo ? 0 : X.C.blando((t - A.fondo) / 0.6)) * (1 - X.C.inOut(X.seg(t, A.vapor - 0.2, A.vapor + 0.3)));
    if (lu > 0.01) lupa.dibuja(t, { x: 585, y: 965, mira: [540 + tiembla * 0, gyS], z: 2.4, a: lu }); else lupa.el.setAttribute('opacity', 0);

    // HUD
    X.anima($('titular'), t, { entra: 0.0, dur: 0.5, sale: A.porque - 0.25, desde: { y: -40, blur: 18, s: 0.94 }, curva: 'firme' });
