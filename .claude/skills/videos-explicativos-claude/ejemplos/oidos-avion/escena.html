<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Oídos taponados en el avión</title>
<link rel="stylesheet" href="motor/explica.css">
<script src="voz/timeline.js"></script>
<script src="motor/explica.js"></script>
<style>
  #lienzo { background: radial-gradient(1100px 900px at 50% 30%, #2A2531 0%, #121016 75%); }
  .piel { fill: url(#g-piel); stroke: #B08F9A; stroke-width: 4; }
  .canal { fill: #1A1620; stroke: var(--linea); stroke-width: 6; stroke-linejoin: round; }
  .camara { fill: url(#g-camara); stroke: #F3D9C8; stroke-width: 6; }
  .timp { fill: none; stroke: #F3B38A; stroke-width: 12; stroke-linecap: round; }
  .trompa { fill: none; stroke: #8E7A86; stroke-linecap: round; }
  .trompa-in { fill: none; stroke: #1A1620; stroke-linecap: round; }
  .flecha { fill: none; stroke: var(--acento); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .tag { font-family: 'Bricolage'; font-weight: 700; font-size: 52px; fill: var(--linea); letter-spacing: -1px; }
  .tag.ac { fill: var(--acento); }
  .tagp { font-family: 'Mono'; font-weight: 700; font-size: 34px; fill: var(--tenue); letter-spacing: 3px; }
  .avion { fill: url(#g-avion); }
  .pill { position: absolute; left: 50%; transform: translateX(-50%); padding: 16px 30px; border-radius: 999px; font-family: 'Mono'; font-weight: 700; font-size: 34px; letter-spacing: 2px; white-space: nowrap;
    background: rgba(23,21,28,.9); border: 2px solid var(--tenue2); }
</style></head>
<body><div id="lienzo">
  <div class="rejilla"></div>
  <svg id="mundo-svg" viewBox="0 0 1080 1920"><g id="cam">
    <!-- el avión (arriba del mundo) -->
    <g id="cielo">
      <rect x="-900" y="-700" width="2900" height="1500" fill="url(#g-cielo)"/><g id="nubes"></g>
      <path class="lf" d="M-300 560 C 200 520 700 600 1400 540" style="stroke:var(--tenue2)"/>
      <g id="avionG" transform="translate(540 330)"><g id="avion">
        <path class="avion" d="M-230 0 C-230 -26 -200 -40 -160 -40 L150 -40 C200 -40 240 -20 250 0 C240 20 200 30 150 30 L-160 30 C-200 30 -230 20 -230 0 Z"/>
        <path class="avion" d="M-20 -30 L-110 -150 L-60 -150 L60 -30 Z M-20 25 L-90 120 L-45 120 L50 25 Z" opacity=".85"/>
        <path class="avion" d="M-210 -30 L-250 -110 L-205 -110 L-160 -35 Z"/>
        
        <circle cx="-110" cy="-8" r="9" fill="#2A2733"/><circle cx="-70" cy="-8" r="9" fill="#2A2733"/><circle cx="-30" cy="-8" r="9" fill="#2A2733"/><circle cx="10" cy="-8" r="9" fill="#2A2733"/><circle cx="50" cy="-8" r="9" fill="#2A2733"/><circle cx="90" cy="-8" r="9" fill="#2A2733"/>
      </g></g>
    </g>
    <!-- el oído en sección -->
    <g id="oido" transform="translate(0 1300)">
      <path class="piel" d="M-200 700 L380 700 Q420 700 430 740 L470 860 L470 940 L430 1060 Q420 1100 380 1100 L-200 1100 Z" opacity=".55"/>
      <path class="canal" d="M-200 840 L470 840 L470 960 L-200 960 Z"/>
      <text class="tagp" x="60" y="815">CONDUCTO AUDITIVO</text>
      <path id="camaraM" class="camara" d="M520 800 C600 760 760 770 790 860 C820 960 760 1040 680 1040 L540 1040 C520 1040 515 1000 515 980 L515 820 Z"/>
      <!-- huesecillos -->
      <path class="lf" d="M560 900 L620 870 L660 905 L700 880" style="stroke:#C9C3BA;stroke-width:9"/>
      <!-- trompa de Eustaquio hasta la garganta -->
      <path id="trompa" class="trompa" d="M700 1035 C720 1180 660 1330 600 1480"/>
      <path id="trompaIn" class="trompa-in" d="M700 1035 C720 1180 660 1330 600 1480"/>
      <path class="canal" d="M520 1470 Q600 1440 680 1470 L700 1900 L500 1900 Z" style="fill:url(#g-piel);stroke:#B08F9A;stroke-width:4"/>
      <text class="tagp" x="740" y="1700">GARGANTA</text>
      <path id="timpGlow" class="timp" style="stroke-width:30;opacity:.35;filter:url(#f-blando)" d="M515 820 Q515 900 515 980"/>
      <path id="timp" class="timp" d="M515 820 Q515 900 515 980"/>
      <g id="flechas">
        <path class="flecha" d="M300 860 L440 860 M415 840 L440 860 L415 880"/>
        <path class="flecha" d="M300 900 L455 900 M430 880 L455 900 L430 920"/>
        <path class="flecha" d="M300 940 L440 940 M415 920 L440 940 L415 960"/>
      </g>
      <g id="aireDentro"></g><g id="aireFuera"></g><g id="aireSube"></g>
      <circle id="dolor" cx="520" cy="900" r="90" fill="var(--peligro)" opacity="0"/>
      <g id="eTimp"><text class="tag ac" x="300" y="1180">TÍMPANO</text><path class="lf ac" d="M420 1140 Q500 1080 512 990" style="stroke-width:5"/></g>
      <g id="eCam"><text class="tag" x="820" y="780">AIRE</text></g>
      <g id="eTrompa"><text class="tag ac" x="760" y="1260">TROMPA DE</text><text class="tag ac" x="760" y="1316">EUSTAQUIO</text></g>
      <g transform="translate(860 1120)"><g id="cerrada"><circle r="46" fill="var(--peligro)"/><text class="tagp" x="0" y="-62" text-anchor="middle" style="fill:var(--peligro)">CERRADA</text><path d="M-17 -17 L17 17 M17 -17 L-17 17" stroke="#fff" stroke-width="10" stroke-linecap="round"/></g></g>
      <g transform="translate(860 1120)"><g id="abierta"><circle r="46" fill="var(--ok)"/><text class="tagp" x="0" y="-62" text-anchor="middle" style="fill:var(--ok)">ABIERTA</text><path d="M-19 1 L-5 15 L20 -13" fill="none" stroke="#0E0D11" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g></g>
    </g>
  </g></svg>
  <div id="titular" class="titular" style="top:1120px">¿Por qué se <em>taponan</em> los oídos?</div>
  <div id="alt" class="pill" style="top:180px">ALTITUD 10.000 m</div>
  <div id="cabina" class="pill" style="top:180px;border-color:var(--agua);color:var(--agua)">CABINA ≈ 2.000 m</div>
  <div id="chicle" class="pill" style="top:180px;border-color:var(--ok);color:var(--ok)">TRAGAR = ABRIR</div>
  <div id="subs"></div>
  <div id="barra" class="progreso"></div>
</div>
<script>
X.listo(() => {
  const $ = (id) => document.getElementById(id), NS0 = 'http://www.w3.org/2000/svg';
  X.defs($('mundo-svg'));
  $('mundo-svg').querySelector('defs').insertAdjacentHTML('beforeend', `
    <linearGradient id="g-cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2A4A"/><stop offset=".55" stop-color="#3B4E78"/><stop offset=".85" stop-color="#4A4766"/><stop offset="1" stop-color="#151319"/></linearGradient>
    <linearGradient id="g-avion" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#DCD8D2"/><stop offset="1" stop-color="#9C9891"/></linearGradient>
    <linearGradient id="g-piel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A4148"/><stop offset="1" stop-color="#2E2227"/></linearGradient>
    <radialGradient id="g-camara" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#3A5A86" stop-opacity=".55"/><stop offset="1" stop-color="#1A2233" stop-opacity=".9"/></radialGradient>`);
  // nubes blandas que pasan (lejos: parallax)
  const azN = X.azar(21);
  const nubes = Array.from({ length: 9 }, (_, i) => { const e = document.createElementNS(NS0, 'ellipse'); e.setAttribute('rx', 140 + azN() * 160); e.setAttribute('ry', 40 + azN() * 30);
    e.setAttribute('fill', '#E8ECF6'); e.setAttribute('opacity', (0.18 + azN() * 0.25).toFixed(2)); e.style.filter = 'blur(14px)'; $('nubes').appendChild(e); return { e, x: azN() * 1800 - 400, y: azN() * 900 - 400, v: 60 + azN() * 120 }; });
  const grano = X.grano($('lienzo'), 0.07);
  // primer plano: nubes y discos de luz muy cerca de la cámara que cruzan desenfocados
  const pp1 = X.primerPlano($('lienzo'), { n: 7, tipo: 'bokeh', color: '#CFE0FF', semilla: 33, prof: [1.7, 2.5], blur: [22, 38], op: [0.12, 0.26] });
  const pp2 = X.primerPlano($('lienzo'), { n: 3, semilla: 47, prof: [2.4, 3.2], blur: [20, 30], op: [0.3, 0.45], tipo: (g) => { g.innerHTML = '<ellipse rx="260" ry="80" fill="#EEF2FA"/><ellipse cx="120" cy="-30" rx="150" ry="70" fill="#EEF2FA"/>'; } });
  const ppNubes = [...document.querySelectorAll('#lienzo > svg')].pop();   // las nubes solo cruzan en los planos del cielo
  const A = {
    aterrizar: X.debe(X.en('aterrizar'), 'aterrizar'), timpano: X.debe(X.en('tímpano'), 'tímpano'), camara: X.debe(X.en('cámara'), 'cámara'),
    salida: X.debe(X.en('salida'), 'salida'), garganta: X.debe(X.en('garganta'), 'garganta'), trompa: X.debe(X.en('trompa'), 'trompa'),
    avion: X.debe(X.en('avión'), 'avión'), metros: X.debe(X.en('metros'), 'metros'), bajar: X.debe(X.en('bajar'), 'bajar'),
    sube: X.debe(X.en('sube rápido'), 'sube rápido'), empuja: X.debe(X.en('empuja'), 'empuja'), duele: X.debe(X.en('duele'), 'duele'),
    cerrada: X.debe(X.en('cerrada'), 'cerrada'), tragas: X.debe(X.en('tragas'), 'tragas'), bostezas: X.debe(X.en('bostezas'), 'bostezas'),
    chicle: X.debe(X.en('chicle'), 'chicle'), tragas2: X.debe(X.en('tragas', 2), 'tragas 2'), entra: X.debe(X.en('entra aire'), 'entra aire'),
    igualan: X.debe(X.en('igualan'), 'igualan'), sitio: X.debe(X.en('sitio'), 'sitio'),
  };
  const cam = $('cam');
  const camaras = [
    { t: 0, x: 540, y: 520, z: 1.0 , rx: 6, ry: -6 },
    { t: A.timpano + 0.1, x: 520, y: 2200, z: 1.25, dur: 1.0 , rx: 4, ry: -12 },
    { t: A.camara + 0.2, x: 640, y: 2200, z: 1.7 , rx: -6, ry: 14 },
    { t: A.salida + 0.4, x: 640, y: 2520, z: 0.95, dur: 1.0 , rx: 8, ry: 8 },
    { t: A.avion + 0.1, x: 540, y: 420, z: 1.05, dur: 1.0 , rx: 0, ry: -10 },
    { t: A.bajar + 0.2, x: 520, y: 2200, z: 1.45, dur: 1.0 , rx: -4, ry: 12 },
    { t: A.cerrada, x: 700, y: 2440, z: 1.5 , rx: 10, ry: -8 },
    { t: A.tragas + 0.1, x: 640, y: 2450, z: 1.05 , rx: -6, ry: 10 },
    { t: A.chicle + 0.2, x: 600, y: 2260, z: 1.15 , rx: 4, ry: 0 },
  ];
  camaras.slice(1).forEach((c) => X.sonido(c.t - (c.dur ?? 1) * 0.8, 'whoosh', 0.7));
  [A.timpano, A.camara, A.trompa, A.metros, A.cerrada, A.tragas, A.chicle].forEach((t) => X.sonido(t, 'pop', 0.6));
  X.sonido(A.sitio, 'notificacion', 0.7);

  // aire: puntos dentro de la cámara (pocos) y fuera, en el conducto (más cuando sube la presión)
  const az = X.azar(3), NS = 'http://www.w3.org/2000/svg';
  const puntos = (g, n, x0, x1, y0, y1, col) => Array.from({ length: n }, () => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 7 + az() * 5); c.setAttribute('fill', col);
    g.appendChild(c); return { c, x: x0 + az() * (x1 - x0), y: y0 + az() * (y1 - y0), f: az() * 6.28, x0, x1, y0, y1 }; });
  const dentro = puntos($('aireDentro'), 14, 560, 760, 820, 1010, 'var(--agua)');
  const fuera = puntos($('aireFuera'), 46, 60, 480, 855, 945, '#BDE4FF');
  const sube = X.particulas($('aireSube'), { n: 14, ruta: (u) => { const p = $('trompa'); const L = p.getTotalLength(); const q = p.getPointAtLength(L * (1 - u)); return [q.x, q.y]; }, vuelta: 0.9, tam: [6, 10], color: 'var(--agua)', op: 0.9, semilla: 7, jitter: 4 });

  const subs = X.subtitulos($('subs'), { max: 3, y: 1470, claves: ['taponan', 'aterrizar', 'tímpano', 'aire', 'salida', 'garganta', 'trompa', 'Eustaquio', 'presurizada', 'metros', 'presión', 'empuja', 'tapado', 'duele', 'cerrada', 'tragas', 'bostezas', 'chicle', 'igualan', 'sitio'] });

  return (t) => {
    X.camara(cam, t, camaras);
    grano(t); pp1(t); pp2(t);
    ppNubes.style.opacity = (1 - X.C.suave(X.seg((X.__cam || { y: 0 }).y, 800, 1500))).toFixed(3);
    X.desenfoqueFondo($('cielo'), { base: 0, porZoom: 7 });
    nubes.forEach((n) => { const x = ((n.x - n.v * t) % 1900 + 1900) % 1900 - 500; n.e.setAttribute('cx', x.toFixed(1)); n.e.setAttribute('cy', n.y); });
    $('barra').style.width = (100 * t / X.dur).toFixed(2) + '%';
    // gancho: el avión baja y la altitud cuenta hacia abajo
    const baja = X.C.inOut(X.seg(t, 0, A.timpano + 0.6));
    $('avionG').setAttribute('transform', `translate(${540 + 60 * baja} ${300 + 110 * baja}) rotate(${(6 * Math.sin(Math.PI * baja)).toFixed(2)})`);
    X.anima($('titular'), t, { entra: 0.02, dur: 0.5, sale: A.timpano - 0.25, desde: { y: -30, blur: 16, s: 0.96 } });
    const alt = Math.round(10000 * (1 - baja) / 100) * 100;
    $('alt').textContent = `ALTITUD ${alt.toLocaleString('es-ES')} m`;
    X.anima($('alt'), t, { entra: 0.05, dur: 0.5, sale: A.timpano - 0.2, desde: { y: -20, blur: 10 } });
    // la cámara del oído y la trompa
    X.traza($('camaraM'), t, A.timpano, 0.9);
    X.anima($('eTimp'), t, { entra: A.timpano + 0.1, dur: 0.5, sale: A.camara + 0.4, desde: { x: -30, y: 0, blur: 10 } });
    X.anima($('eCam'), t, { entra: A.camara + 0.2, dur: 0.5, sale: A.salida, desde: { x: 30, y: 0, blur: 10 } });
    X.traza($('trompa'), t, A.salida, 1.0); X.traza($('trompaIn'), t, A.salida + 0.05, 1.0);
    X.anima($('eTrompa'), t, { entra: A.trompa, dur: 0.6, sale: A.avion - 0.1, desde: { x: 30, y: 0, blur: 12 } });
    // presión: la de fuera sube al bajar; se iguala al tragar
    const pf = X.C.inOut(X.seg(t, A.bajar, A.empuja + 0.4)) * (1 - X.C.out(X.seg(t, A.igualan - 0.2, A.igualan + 0.6)));
    // apertura de la trompa: dos tragos (pulsos) y el del chicle, que la deja abierta hasta igualar
    const pulso = (a) => X.C.out(X.seg(t, a - 0.05, a + 0.2)) * (1 - X.C.inOut(X.seg(t, a + 0.5, a + 0.8)));
    const ab = Math.max(pulso(A.tragas), pulso(A.bostezas), X.C.out(X.seg(t, A.tragas2 - 0.05, A.tragas2 + 0.25)) * (1 - X.C.inOut(X.seg(t, A.sitio + 0.3, A.sitio + 0.9))));
    $('trompa').style.strokeWidth = (26 + 24 * ab).toFixed(1); $('trompaIn').style.strokeWidth = (4 + 26 * ab).toFixed(1);
    // tímpano: se curva hacia dentro con la presión de fuera
    const b = 46 * pf;
    $('timp').setAttribute('d', `M515 820 Q${(515 + 2 * b).toFixed(1)} 900 515 980`); $('timpGlow').setAttribute('d', `M515 820 Q${(515 + 2 * b).toFixed(1)} 900 515 980`);
    $('flechas').style.opacity = (pf * 1).toFixed(3); $('flechas').setAttribute('transform', `translate(${(-30 * (1 - pf)).toFixed(1)} 0)`);
    $('dolor').setAttribute('opacity', (0.35 * X.C.suave(X.seg(t, A.duele - 0.1, A.duele + 0.3)) * (1 - X.seg(t, A.cerrada, A.cerrada + 0.6)) * (0.7 + 0.3 * Math.sin(t * 14))).toFixed(3));
    // puntos de aire
    const visAire = X.C.out(X.seg(t, A.camara, A.camara + 0.6));
    dentro.forEach((p, i) => { p.c.setAttribute('cx', (p.x + 12 * Math.sin(t * 1.3 + p.f)).toFixed(1)); p.c.setAttribute('cy', (p.y + 10 * Math.cos(t * 1.1 + p.f)).toFixed(1)); p.c.setAttribute('opacity', (0.8 * visAire).toFixed(3)); });
    const dens = X.C.out(X.seg(t, A.bajar - 0.2, A.bajar + 0.6));
    fuera.forEach((p, i) => { const on = i < 14 + 32 * pf; const x = p.x + 40 * pf * (p.x / 480) + 10 * Math.sin(t * 2 + p.f);
      p.c.setAttribute('cx', Math.min(500, x).toFixed(1)); p.c.setAttribute('cy', (p.y + 6 * Math.cos(t * 1.7 + p.f)).toFixed(1)); p.c.setAttribute('opacity', on ? (0.75 * dens).toFixed(3) : '0'); });
    sube.dibuja(t, A.entra - 0.3, A.sitio);
    // etiquetas de estado
    X.anima($('cabina'), t, { entra: A.metros - 0.1, dur: 0.5, sale: A.cerrada - 0.2, desde: { y: -20, blur: 10 } });
    X.anima($('cerrada'), t, { entra: A.cerrada, dur: 0.5, sale: A.tragas - 0.1, desde: { s: 0.4, y: 0, blur: 8 }, curva: 'blando' });
    X.anima($('abierta'), t, { entra: A.tragas, dur: 0.4, sale: A.chicle - 0.2, desde: { s: 0.4, y: 0, blur: 8 }, curva: 'blando' });
    X.anima($('chicle'), t, { entra: A.chicle, dur: 0.5, desde: { y: -20, blur: 10 } });
    subs.dibuja(t);
  };
});
</script></body></html>
