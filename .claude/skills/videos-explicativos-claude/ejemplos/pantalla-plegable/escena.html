<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Pantalla plegable</title>
<link rel="stylesheet" href="motor/explica.css">
<script src="voz/timeline.js"></script>
<script src="motor/explica.js"></script>
<script src="motor/materiales.js"></script>
<style>
  #lienzo { background: #0D0B12; }
  .lbl { font-family: 'Bricolage'; font-weight: 700; font-size: 52px; letter-spacing: -1px; fill: #F3EEE6; }
  .lbls { font-family: 'Mono'; font-weight: 700; font-size: 24px; letter-spacing: 3px; fill: rgba(243,238,230,.55); }
  .pill { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 200px; padding: 18px 34px; border-radius: 999px; font-family: 'Mono'; font-weight: 700;
    font-size: 36px; letter-spacing: 2px; white-space: nowrap; background: rgba(20,18,26,.86); border: 2px solid rgba(255,255,255,.14);
    box-shadow: 0 18px 40px -12px rgba(0,0,0,.7); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 16px; }
  .pill .dot { width: 20px; height: 20px; border-radius: 50%; }
  .card { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 190px; padding: 22px 46px 26px; border-radius: 34px; text-align: center;
    background: rgba(20,18,26,.88); border: 2px solid rgba(255,255,255,.14); box-shadow: 0 30px 60px -20px rgba(0,0,0,.85); backdrop-filter: blur(8px); white-space: nowrap; }
  .card .num { font-family: 'Bricolage'; font-weight: 700; font-size: 150px; line-height: 1; letter-spacing: -4px; color: #7FE3FF; text-shadow: 0 0 40px rgba(127,227,255,.45); }
  .card .num span { font-size: 80px; letter-spacing: -1px; }
  .card small { display: block; font-family: 'Mono'; font-weight: 700; font-size: 28px; letter-spacing: 4px; color: var(--tenue); margin-top: 8px; }
  .titular { text-shadow: 0 10px 40px rgba(0,0,0,.7); font-size: 82px; left: 40px; right: 40px; }
  #tinte { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(900px 1100px at 50% 45%, rgba(40,140,190,.55), rgba(10,30,60,.0) 75%); mix-blend-mode: screen; opacity: 0; }
</style></head>
<body><div id="lienzo">
  <svg id="mundo-svg" viewBox="0 0 1080 1920"><g id="cam">
    <!-- fondo: estudio oscuro con rejilla de plano técnico (lejos, parallax) -->
    <g id="fondo">
      <rect x="-1800" y="-1200" width="6000" height="8000" fill="url(#g-fondo)"/>
      <rect x="-1800" y="-1200" width="6000" height="8000" fill="url(#p-rejilla)" opacity=".55"/>
      <circle cx="540" cy="700" r="900" fill="url(#g-halo-calido)"/>
      <circle cx="1900" cy="800" r="800" fill="url(#g-halo-frio)"/>
      <circle cx="560" cy="2700" r="900" fill="url(#g-halo-frio)"/>
      <circle cx="1900" cy="2500" r="900" fill="url(#g-halo-calido)"/>
      <circle cx="540" cy="4650" r="900" fill="url(#g-halo-frio)"/>
    </g>
    <!-- S1 · suelo brillante del escaparate -->
    <rect x="-900" y="1262" width="2900" height="900" fill="url(#g-suelo)"/>
    <rect x="-900" y="1258" width="2900" height="5" fill="#fff" opacity=".06"/>
    <g id="reflejo" mask="url(#m-reflejo)" opacity=".32"><g transform="translate(0 2530) scale(1 -1)"><use href="#telefono"/></g></g>
    <ellipse cx="540" cy="1262" rx="380" ry="26" fill="url(#g-contacto)"/>
    <g id="telefono"></g>
    <g id="lupaCapa"></g>

    <!-- S2 · vidrio rígido contra lámina flexible -->
    <g id="s2"></g>
    <!-- S3 · capas que se separan -->
    <g id="s3"></g>
    <!-- S4 · el doblez en sección: se estira, se aprieta, eje neutro -->
    <g id="s4"></g>
    <!-- S5 · la bisagra -->
    <g id="s5"></g>
  </g></svg>
  <div id="tinte"></div>

  <div id="titular" class="titular" style="top:180px">¿Cómo se dobla una<br>pantalla <em>sin romperse</em>?</div>
  <div id="pDuo" class="pill"><span class="dot" style="background:var(--acento)"></span>iPHONE DUO · A LA VENTA 23 OCT</div>
  <div id="pRaja" class="pill" style="border-color:var(--peligro);color:#FF8A8D;background:rgba(60,14,20,.86)"><span class="dot" style="background:var(--peligro)"></span>EL VIDRIO NORMAL SE RAJA</div>
  <div id="pDentro" class="pill"><span class="dot" style="background:#7FE3FF"></span>LA PANTALLA, POR DENTRO</div>
  <div id="cMicras" class="card"><div class="num" id="nMicras">0<span> µm</span></div><small>CRISTAL ULTRAFINO</small></div>
  <div id="tEje" class="card" style="top:180px"><div class="num" style="font-size:118px;color:var(--acento);text-shadow:0 0 40px rgba(255,138,91,.5)">EJE NEUTRO</div><small>NI SE ESTIRA NI SE APRIETA</small></div>
  <div id="pBisagra" class="pill"><span class="dot" style="background:#C9D2DE"></span>LA BISAGRA</div>
  <div id="pFin" class="pill" style="border-color:var(--ok);color:#9FF3C4;background:rgba(14,48,32,.86)"><span class="dot" style="background:var(--ok)"></span>SE DOBLA · NO SE ROMPE</div>
  <div id="subs"></div>
  <div id="barra" class="progreso"></div>
</div>
<script>
X.listo(() => {
  const $ = (id) => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
  const svg = $('mundo-svg');
  X.defs(svg); X.materiales(svg);
  svg.querySelector('defs').insertAdjacentHTML('beforeend', `
    <linearGradient id="g-fondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151221"/><stop offset=".5" stop-color="#100E18"/><stop offset="1" stop-color="#0B0A10"/></linearGradient>
    <pattern id="p-rejilla" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0 L0 0 0 80" fill="none" stroke="rgba(150,180,255,.09)" stroke-width="2"/></pattern>
    <radialGradient id="g-halo-calido"><stop offset="0" stop-color="#FF8A5B" stop-opacity=".16"/><stop offset="1" stop-color="#FF8A5B" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-halo-frio"><stop offset="0" stop-color="#5FB8FF" stop-opacity=".15"/><stop offset="1" stop-color="#5FB8FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-suelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D1928"/><stop offset="1" stop-color="#0B0A10"/></linearGradient>
    <linearGradient id="g-refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="m-reflejo" maskUnits="userSpaceOnUse" x="-900" y="1262" width="2900" height="900"><rect x="-900" y="1262" width="2900" height="420" fill="url(#g-refl)"/></mask>
    <linearGradient id="g-wall" gradientUnits="userSpaceOnUse" x1="250" y1="420" x2="830" y2="1240"><stop offset="0" stop-color="#3B1D6E"/><stop offset=".45" stop-color="#B63F7A"/><stop offset=".8" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FFC27A"/></linearGradient>
    <linearGradient id="g-titanio" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9D4CC"/><stop offset=".5" stop-color="#8F8B86"/><stop offset="1" stop-color="#C9C4BC"/></linearGradient>
    <linearGradient id="g-espec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="g-vidrio" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFF4FF" stop-opacity=".95"/><stop offset=".5" stop-color="#7FD3EE" stop-opacity=".75"/><stop offset="1" stop-color="#3E8FB0" stop-opacity=".9"/></linearGradient>
    <linearGradient id="g-ambar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC56B"/><stop offset="1" stop-color="#C9731C"/></linearGradient>
    <pattern id="p-rgb" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#120F18"/><rect x="2" y="3" width="5" height="18" rx="2" fill="#FF4D5E"/><rect x="9.5" y="3" width="5" height="18" rx="2" fill="#4BEA7A"/><rect x="17" y="3" width="5" height="18" rx="2" fill="#4F8BFF"/></pattern>
    <pattern id="p-rgb2" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#120F18"/><rect x="1" y="2" width="4" height="14" rx="1.5" fill="#FF4D5E"/><rect x="7" y="2" width="4" height="14" rx="1.5" fill="#4BEA7A"/><rect x="13" y="2" width="4" height="14" rx="1.5" fill="#4F8BFF"/></pattern>`);
  const el = (tag, at = {}, padre) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (padre) padre.appendChild(e); return e; };
  // etiqueta de cristal en el mundo (callout): devuelve el grupo (envuelto para poder animarlo)
  const etiqueta = (padre, x, y, texto, sub, color, { ancla = 'izq', tam = 52 } = {}) => {
    const w = el('g', { transform: `translate(${x} ${y})` }, padre), g = el('g', {}, w);
    const caja = el('rect', { x: 0, y: -50, height: sub ? 104 : 80, rx: 20, fill: 'rgba(20,18,26,.86)', stroke: 'rgba(255,255,255,.14)', 'stroke-width': 2, filter: 'url(#f-sombra-s)' }, g);
    el('circle', { cx: 30, cy: sub ? 2 : -10, r: 11, fill: color }, g);
    if (sub) { const s = el('text', { x: 54, y: -16, class: 'lbls' }, g); s.textContent = sub; }
    const tx = el('text', { x: 54, y: sub ? 34 : 6, class: 'lbl', 'font-size': tam }, g); tx.textContent = texto;
    const ancho = Math.max(tx.getComputedTextLength(), sub ? g.querySelector('.lbls').getComputedTextLength() : 0) + 84;
    caja.setAttribute('width', ancho); caja.setAttribute('y', sub ? -48 : -50);
    if (ancla === 'der') g.setAttribute('transform', `translate(${-ancho} 0)`); else if (ancla === 'centro') g.setAttribute('transform', `translate(${-ancho / 2} 0)`);
    return { w, g, texto: tx, ancho, sombra: w };
  };
  const marca = (padre, x, y, ok) => { const w = el('g', { transform: `translate(${x} ${y})` }, padre), g = el('g', {}, w);
    el('circle', { r: 44, fill: ok ? 'var(--ok)' : 'var(--peligro)', filter: 'url(#f-brillo)' }, g);
    el('path', ok ? { d: 'M-19 2 L-5 16 L21 -13', fill: 'none', stroke: '#0E0D11', 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' } : { d: 'M-16 -16 L16 16 M16 -16 L-16 16', stroke: '#fff', 'stroke-width': 10, 'stroke-linecap': 'round' }, g);
    return g; };

  // ---------- anclas ----------
  const A = {
    pantalla: X.debe(X.en('pantalla'), 'pantalla'), duo: X.debe(X.en('Duo'), 'Duo'), abre: X.debe(X.en('abre'), 'abre'), mitad: X.debe(X.en('mitad'), 'mitad'),
    cristal: X.debe(X.en('cristal normal'), 'cristal normal'), doblarlo: X.debe(X.en('doblarlo'), 'doblarlo'), raja: X.debe(X.en('rajaría'), 'rajaría'),
    truco: X.debe(X.en('truco'), 'truco'), dentro: X.debe(X.en('dentro'), 'dentro'), pixeles: X.debe(X.en('píxeles'), 'píxeles'), vidrio: X.debe(X.en('vidrio'), 'vidrio'),
    plastico: X.debe(X.en('plástico'), 'plástico'), poli: X.debe(X.en('poliimida'), 'poliimida'), encima: X.debe(X.en('encima'), 'encima'),
    treinta: X.debe(X.en('30'), '30'), micras: X.debe(X.en('micras'), 'micras'), fino: X.debe(X.en('fino'), 'fino'), parte: X.debe(X.en('parte'), 'parte'),
    sedobla: X.debe(X.en('se dobla', 2), 'se dobla'), curioso: X.debe(X.en('curioso'), 'curioso'), doblar: X.debe(X.en('al doblar', 2), 'al doblar'),
    estira: X.debe(X.en('estira'), 'estira'), aprieta: X.debe(X.en('aprieta'), 'aprieta'), linea: X.debe(X.en('línea'), 'línea'), eje: X.debe(X.en('eje neutro'), 'eje neutro'),
    capas: X.debe(X.en('capas delicadas'), 'capas delicadas'), bisagra: X.debe(X.en('bisagra'), 'bisagra'), pico: X.debe(X.en('pico'), 'pico'), gota: X.debe(X.en('gota'), 'gota'),
    poreso: X.debe(X.en('por eso'), 'por eso'), abre2: X.debe(X.en('abre', 2), 'abre (final)'), romperse2: X.debe(X.en('romperse', 2), 'romperse (final)'),
  };

  // =========================================================== S1 · el teléfono plegable (falso 3D con luz especular)
  const HX = 540, Y0 = 420, Y1 = 1240, HW = 290;   // bisagra, arriba, abajo, ancho de cada mitad
  const tel = $('telefono');
  const mitad = (lado) => {   // lado -1 = izquierda, +1 = derecha. Coordenadas locales = teléfono abierto y plano
    const g = el('g', {}, tel), x0 = lado < 0 ? HX - HW : HX, x1 = lado < 0 ? HX : HX + HW, id = 'clip' + (lado < 0 ? 'I' : 'D');
    el('clipPath', { id }, g).appendChild(el('rect', { x: x0 + (lado < 0 ? 14 : 0), y: Y0 + 14, width: HW - 14, height: Y1 - Y0 - 28, rx: 0 }));
    // marco de titanio (esquinas redondeadas solo por fuera)
    const R = 56, ext = lado < 0 ? x0 : x1, int = lado < 0 ? x1 : x0, s = lado;
    const dMarco = `M${int} ${Y0} L${ext - s * R} ${Y0} Q${ext} ${Y0} ${ext} ${Y0 + R} L${ext} ${Y1 - R} Q${ext} ${Y1} ${ext - s * R} ${Y1} L${int} ${Y1} Z`;
    el('path', { d: dMarco, fill: 'url(#g-titanio)', filter: 'url(#m-metal)' }, g);
    el('path', { d: dMarco, fill: 'none', stroke: 'rgba(255,255,255,.35)', 'stroke-width': 2 }, g);
    const sc = el('g', { 'clip-path': `url(#${id})` }, g);
    const R2 = 42, e2 = ext - s * 14;
    const dPant = `M${int} ${Y0 + 14} L${e2 - s * R2} ${Y0 + 14} Q${e2} ${Y0 + 14} ${e2} ${Y0 + 14 + R2} L${e2} ${Y1 - 14 - R2} Q${e2} ${Y1 - 14} ${e2 - s * R2} ${Y1 - 14} L${int} ${Y1 - 14} Z`;
    el('path', { d: dPant, fill: '#06050A' }, sc);
    const ins = 10, wall = el('g', {}, sc);
    el('rect', { x: HX - HW + ins, y: Y0 + 24, width: 2 * HW - 2 * ins, height: Y1 - Y0 - 48, rx: 34, fill: 'url(#g-wall)' }, wall);
    // ondas del fondo de pantalla
    [[0.32, '#FFB07A', .35], [0.55, '#FF6FA5', .28], [0.75, '#7A5CFF', .3]].forEach(([k, c, o], i) => {
      let d = `M${HX - HW} ${Y0 + (Y1 - Y0) * k}`; for (let x = HX - HW; x <= HX + HW; x += 20) d += ` L${x} ${(Y0 + (Y1 - Y0) * k + 40 * Math.sin(x / 70 + i * 2)).toFixed(1)}`;
      el('path', { d: d + ` L${HX + HW} ${Y1} L${HX - HW} ${Y1} Z`, fill: c, opacity: o }, wall); });
    // iconos genéricos (rejilla 4×5 en la pantalla abierta)
    const cols = ['#FFFFFF', '#FFD37A', '#7FE3FF', '#8BF0B0', '#FF9FB6', '#C8B6FF'];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) { const x = HX - HW + 46 + c * 88, y = Y0 + 120 + r * 108;
      if ((lado < 0) !== (x + 32 < HX)) continue; if (r === 4 && c > 1 && c < 4) continue;
      el('rect', { x, y, width: 64, height: 64, rx: 18, fill: cols[(r * 6 + c * 5) % 6], opacity: .82 }, wall);
      el('rect', { x: x + 4, y: y + 4, width: 56, height: 22, rx: 11, fill: '#fff', opacity: .25 }, wall); }
    el('rect', { x: HX - HW + 40, y: Y1 - 160, width: 2 * HW - 80, height: 100, rx: 34, fill: '#fff', opacity: .16 }, wall);
    const sombra = el('rect', { x: x0, y: Y0, width: HW, height: Y1 - Y0, fill: '#000', opacity: 0 }, sc);
    const espec = el('rect', { x: x0 - 400, y: Y0 - 200, width: 260, height: Y1 - Y0 + 400, fill: 'url(#g-espec)', transform: 'rotate(18 540 830)' }, sc);
    return { g, sombra, espec, lado };
  };
  const mI = mitad(-1), mD = mitad(1);
  // el pliegue (se ve un poco con la pantalla plana)
  const pliegue = el('g', {}, tel);
  el('rect', { x: HX - 7, y: Y0 + 14, width: 14, height: Y1 - Y0 - 28, fill: 'url(#g-cromo)', opacity: .22 }, pliegue);
  el('line', { x1: HX, y1: Y0 + 14, x2: HX, y2: Y1 - 14, stroke: '#000', 'stroke-width': 2, opacity: .5 }, pliegue);
  const K = 0.24;
  const pliega = (a, t) => {   // a = ángulo de cada mitad (grados, 0 = plana)
    const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    mI.g.setAttribute('transform', `matrix(${c.toFixed(4)} ${(K * s).toFixed(4)} 0 1 ${(HX - HX * c).toFixed(2)} ${(-HX * K * s).toFixed(2)})`);
    mD.g.setAttribute('transform', `matrix(${c.toFixed(4)} ${(-K * s).toFixed(4)} 0 1 ${(HX - HX * c).toFixed(2)} ${(HX * K * s).toFixed(2)})`);
    mI.sombra.setAttribute('opacity', (0.42 * s).toFixed(3)); mD.sombra.setAttribute('opacity', (0.12 * s).toFixed(3));
    const px = 300 + 520 * ((t * 0.18 + a / 120) % 1.4);
    [mI, mD].forEach((m) => m.espec.setAttribute('x', (px - 200).toFixed(1)));
    pliegue.setAttribute('opacity', (1 - X.limita(a / 25)).toFixed(3));
  };
  const lupa = X.lupa($('lupaCapa'), { fuente: '#telefono', r: 165, zoom: 3 });
  const eLupa = etiqueta($('lupaCapa'), 790, 470, 'PLIEGUE', 'LA MITAD', 'var(--acento)', { ancla: 'centro', tam: 48 });
  const e76 = etiqueta($('lupaCapa'), 300, 372, '7,6 PULGADAS', 'ABIERTA', '#FFC27A', { ancla: 'centro' });

  // =========================================================== S2 · vidrio que se raja / lámina que se curva
  const s2 = $('s2'), C2 = 1900, XA = 1580, XB = 2220, YV = 700, TV = 34, YF = 1010;
  const pinza = (x, y) => { el('rect', { x: x - 46, y: y - 70, width: 92, height: 140 + TV, rx: 16, fill: '#8E96A3', filter: 'url(#m-metal)' }, s2);
    el('rect', { x: x - 46, y: y - 6, width: 92, height: TV + 12, fill: '#2A2732' }, s2); el('circle', { cx: x, cy: y - 42, r: 9, fill: '#C9D2DE' }, s2); el('circle', { cx: x, cy: y + TV + 42, r: 9, fill: '#C9D2DE' }, s2); };
  const vidrioG = el('g', {}, s2);
  const vEntero = el('path', { fill: 'url(#g-vidrio)', filter: 'url(#m-cristal)', stroke: '#E8FBFF', 'stroke-width': 2 }, vidrioG);
  const trozoI = el('g', {}, vidrioG), trozoD = el('g', {}, vidrioG);
  el('path', { d: `M${XA} ${YV} L${C2 - 6} ${YV} L${C2 + 8} ${YV + 10} L${C2 - 10} ${YV + 22} L${C2 + 2} ${YV + TV} L${XA} ${YV + TV} Z`, fill: 'url(#g-vidrio)', filter: 'url(#m-cristal)', stroke: '#E8FBFF', 'stroke-width': 2 }, trozoI);
  el('path', { d: `M${XB} ${YV} L${C2 - 6} ${YV} L${C2 + 8} ${YV + 10} L${C2 - 10} ${YV + 22} L${C2 + 2} ${YV + TV} L${XB} ${YV + TV} Z`, fill: 'url(#g-vidrio)', filter: 'url(#m-cristal)', stroke: '#E8FBFF', 'stroke-width': 2 }, trozoD);
  const grietas = [];
  const az2 = X.azar(7);
  for (let i = 0; i < 7; i++) { let x = C2, y = YV + 17, d = `M${x} ${y}`; const dir = i % 2 ? 1 : -1, ang = (az2() - 0.5) * 0.9;
    for (let k = 0; k < 6; k++) { x += dir * (22 + az2() * 26); y += Math.tan(ang) * 20 + (az2() - 0.5) * 26; d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
    grietas.push(el('path', { d, fill: 'none', stroke: '#FFFFFF', 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .9 }, s2)); }
  const empujador = el('g', {}, s2);
  el('rect', { x: C2 - 22, y: YV - 420, width: 44, height: 400, rx: 12, fill: '#9AA3B2', filter: 'url(#m-metal)' }, empujador);
  el('rect', { x: C2 - 40, y: YV - 36, width: 80, height: 34, rx: 12, fill: '#C9D2DE', filter: 'url(#m-metal)' }, empujador);
  pinza(XA, YV); pinza(XB, YV);
  const ondaVidrio = X.onda(s2, { x: C2, y: YV + 17, color: '#FF5A5F', radio: 300, ancho: 12 });
  const film = el('path', { fill: 'url(#g-ambar)', filter: 'url(#m-plastico)' }, s2);
  const filmLuz = el('path', { fill: 'none', stroke: '#FFE6B8', 'stroke-width': 4, opacity: .7 }, s2);
  pinza(XA, YF); pinza(XB, YF);
  const eVidrio = etiqueta(s2, XA - 50, YV - 120, 'VIDRIO', 'RÍGIDO', '#7FE3FF', { tam: 50 });
  const eFlex = etiqueta(s2, XA - 50, YF + 190, 'LÁMINA FLEXIBLE', null, '#FFC56B', { tam: 50 });
  const xRaja = marca(s2, XB - 40, YV - 90, false), okFlex = marca(s2, XB - 40, YF + 200, true);

  // =========================================================== S3 · explosión de capas (isométrico)
  const s3 = $('s3'), C3 = 420, W3 = 270, H3 = 114;

    vEntero.style.display = roto ? 'none' : ''; trozoI.style.display = trozoD.style.display = roto ? '' : 'none';
    const caida = roto ? X.C.blando((t - A.raja) / 0.7) : 0;
    trozoI.setAttribute('transform', `rotate(${(16 * caida).toFixed(2)} ${XA} ${YV + TV})`); trozoD.setAttribute('transform', `rotate(${(-16 * caida).toFixed(2)} ${XB} ${YV + TV})`);
    grietas.forEach((g, i) => { X.traza(g, t, A.raja - 0.06 + i * 0.015, 0.22, 'out'); g.style.opacity = roto ? (0.9 * (1 - X.seg(t, A.raja + 0.25, A.raja + 0.9))).toFixed(3) : '0'; });
    ondaVidrio.dibuja(t, A.raja);
    empujador.setAttribute('transform', `translate(0 ${(2 * sag + (roto ? 50 * caida : 0) - 30 + 30 * Math.min(1, empuje * 4)).toFixed(1)})`);
    const fsag = 150 * (t < A.doblarlo - 0.2 ? 0 : X.C.natural((t - (A.doblarlo - 0.2)) / 1.3));
    film.setAttribute('d', `M${XA} ${YF} Q${C2} ${YF + 2 * fsag} ${XB} ${YF} L${XB} ${YF + 20} Q${C2} ${YF + 20 + 2 * fsag} ${XA} ${YF + 20} Z`);
    filmLuz.setAttribute('d', `M${XA} ${YF + 4} Q${C2} ${YF + 4 + 2 * fsag} ${XB} ${YF + 4}`);
    X.anima(eVidrio.g, t, { entra: A.cristal + 0.1, dur: 0.5, desde: { x: -40, y: 0, blur: 10 }, curva: 'blando' });
    X.anima(eFlex.g, t, { entra: A.doblarlo, dur: 0.5, desde: { x: -40, y: 0, blur: 10 }, curva: 'blando' });
    X.anima(xRaja, t, { entra: A.raja + 0.05, dur: 0.5, desde: { s: 0.3, y: 0, blur: 10 }, curva: 'blando' });
    X.anima(okFlex, t, { entra: A.raja + 0.25, dur: 0.5, desde: { s: 0.3, y: 0, blur: 10 }, curva: 'blando' });
    X.anima($('pRaja'), t, { entra: A.raja + 0.05, dur: 0.5, sale: A.truco - 0.1, desde: { y: -30, blur: 14, s: 0.9 }, curva: 'blando' });

    // ---- S3: las capas se separan
    const ex = t < A.dentro - 0.15 ? 0 : X.C.natural((t - (A.dentro - 0.15)) / 0.9);
    X.anima($('pDentro'), t, { entra: A.truco + 0.1, dur: 0.5, sale: A.encima - 0.3, desde: { y: -30, blur: 14, s: 0.9 }, curva: 'blando' });
    capas.forEach((c, i) => {
      const dy = X.lerp(c.yc - c.y, 0, ex);
      let dx = 0, op = 1;
      if (c.id === 'poli') { const entra = t < A.plastico - 0.1 ? 0 : X.C.natural((t - (A.plastico - 0.1)) / 0.7); dx = X.lerp(-900, 0, entra); op = entra > 0 ? 1 : 0;
        const fa = (t < A.vidrio - 0.1 ? 0 : X.C.blando((t - (A.vidrio - 0.1)) / 0.5)) * (1 - X.C.in(X.seg(t, A.plastico - 0.1, A.plastico + 0.3)));
        c.fantasma.w.setAttribute('transform', `translate(0 ${(dy - 40 * (1 - fa)).toFixed(1)})`); c.fantasma.w.style.opacity = X.limita(fa).toFixed(3);
        X.anima(c.xFant, t, { entra: A.vidrio + 0.1, dur: 0.45, desde: { s: 0.3, y: 0, blur: 8 }, curva: 'blando' });
        const ola = entra > 0 && entra < 1.2 ? 14 * Math.sin((t - A.plastico) * 12) * Math.exp(-2.5 * (t - A.plastico)) : 0;
        c.L.g.setAttribute('transform', `skewY(${(ola * 0.25).toFixed(2)})`); }
      c.L.w.setAttribute('transform', `translate(${dx.toFixed(1)} ${dy.toFixed(1)})`); c.L.w.style.opacity = op;
      // etiquetas: aparecen al separarse; la que se nombra, en grande
      const tEti = c.id === 'poli' ? A.poli : A.dentro + 0.25 + i * 0.07;
      X.anima(c.E.g, t, { entra: tEti, dur: 0.5, desde: { x: -30, y: 0, blur: 10, s: 0.92 }, curva: 'blando' });
    });
    const foco = t < A.pixeles ? null : t < A.vidrio ? 'pix' : t < A.encima ? 'poli' : 'cristal';
    capas.forEach((c) => { c.E.g.style.opacity = c.E.g.style.opacity === '' ? (foco && foco !== c.id && t < A.fino ? '0.5' : '') : c.E.g.style.opacity; });
    P3.pix.brillo.setAttribute('opacity', (0.85 * X.C.suave(X.seg(t, A.pixeles, A.pixeles + 0.4)) * (0.75 + 0.25 * Math.sin(t * 5)) * (1 - X.seg(t, A.vidrio, A.vidrio + 0.6))).toFixed(3));
    const es = X.seg(t, A.encima, A.encima + 1.4); P3.cristal.espec.setAttribute('opacity', (es > 0 && es < 1 ? Math.sin(Math.PI * es) : 0).toFixed(3));
    P3.cristal.espec.setAttribute('transform', `translate(${(-500 + 1000 * es).toFixed(1)} 0)`);
    X.anima(cota, t, { entra: A.treinta - 0.1, dur: 0.5, desde: { s: 0.6, y: 0, blur: 10 }, curva: 'blando' });
    X.anima($('cMicras'), t, { entra: A.treinta - 0.1, dur: 0.55, sale: A.curioso - 0.3, desde: { y: -40, blur: 16, s: 0.9 }, curva: 'firme' });
    contador.dibuja(t, A.treinta - 0.05, 1.0); if ($('nMicras').lastChild.nodeType === 3 || !$('nMicras').querySelector('span')) $('nMicras').innerHTML = $('nMicras').textContent.replace(/[^\d]/g, '') + '<span> µm</span>';
    dMicras.dibuja(t, A.micras);

    // ---- S4: sección que se dobla
    const kFino = (t < A.sedobla - 0.25 ? 0 : X.C.natural((t - (A.sedobla - 0.25)) / 0.9)) * (1.25 / L4);
    const grueso = t < A.curioso - 0.15 ? 0 : X.C.firme((t - (A.curioso - 0.15)) / 0.8);
    const kU = (t < A.doblar ? 0 : X.C.natural((t - A.doblar) / 1.2)) * (Math.PI * 0.9 / L4);
    const k = grueso > 0 ? X.lerp(kFino * (1 - X.limita(grueso * 1.4)), 0, 0) + kU : kFino;
    fino.setAttribute('d', tira(-11 * (1 - grueso) - 60 * grueso, 11 * (1 - grueso) - 44 * grueso, k));
    fino.style.opacity = grueso >= 1 ? '0' : '1';
    banda.forEach((b, i) => { const [n1, n2] = capas4[i], gs = X.limita((grueso - i * 0.08) / 0.7); b.setAttribute('d', tira(n1 * gs, n2 * gs, k)); b.style.opacity = gs.toFixed(3); });
    const rv = X.seg(t, A.doblar, A.doblar + 0.6) * (1 - 0);
    rayas.forEach((r, i) => { const s = -L4 / 2 + (i + 0.5) * L4 / 17, p = pt(s, -60, k), q = pt(s, 60, k); r.setAttribute('d', `M${p[0].toFixed(1)} ${p[1].toFixed(1)} L${q[0].toFixed(1)} ${q[1].toFixed(1)}`); r.style.opacity = (0.6 * rv).toFixed(3); });
    const fF = X.C.suave(X.seg(t, A.estira - 0.1, A.estira + 0.4)), fD = X.C.suave(X.seg(t, A.aprieta - 0.1, A.aprieta + 0.4));
    const late = 1 + 0.08 * Math.sin(t * 7);
    flechasFuera.innerHTML = fF > 0 ? [-300, -150, 0, 150, 300].map((s) => flechita(s, 86 * late, k, 1, '#FF5A5F')).join('') : ''; flechasFuera.style.opacity = fF.toFixed(3);
    flechasDentro.innerHTML = fD > 0 ? [-250, -125, 0, 125, 250].map((s) => flechita(s, -84, k, -1, '#4FB3FF')).join('') : ''; flechasDentro.style.opacity = fD.toFixed(3);
    X.anima(eEstira.g, t, { entra: A.estira, dur: 0.5, desde: { y: 30, blur: 10, s: 0.9 }, curva: 'blando' });
    X.anima(eAprieta.g, t, { entra: A.aprieta, dur: 0.5, desde: { y: -30, blur: 10, s: 0.9 }, curva: 'blando' });
    X.anima(okFino, t, { entra: A.sedobla + 0.2, dur: 0.5, sale: A.curioso - 0.2, desde: { s: 0.3, y: 0, blur: 10 }, curva: 'blando' });
    neutro.setAttribute('d', linea(0, k)); X.traza(neutro, t, A.linea - 0.05, 0.9, 'inOut'); neutroSombra.setAttribute('d', linea(0, k)); X.traza(neutroSombra, t, A.linea - 0.05, 0.9, 'inOut');
    neutro.setAttribute('stroke-width', (12 + 3 * Math.sin(t * 6)).toFixed(2));
    X.anima($('tEje'), t, { entra: A.eje - 0.05, dur: 0.6, sale: A.bisagra - 0.35, desde: { y: -40, blur: 16, s: 0.9 }, curva: 'firme' });
    dEje.dibuja(t, A.eje + 0.4);
    const mv = t < A.capas ? 0 : X.C.natural((t - A.capas) / 0.9);
    const pc = X.lerp(-27, 0, mv);
    pixMovil.setAttribute('d', tira(pc - 7, pc + 7, k)); pixMovil.style.opacity = X.seg(t, A.capas - 0.2, A.capas).toFixed(3);
    pixBrillo.setAttribute('d', linea(pc, k)); pixBrillo.setAttribute('opacity', (0.55 * mv * (0.7 + 0.3 * Math.sin(t * 6))).toFixed(3));
    X.anima(ePix.g, t, { entra: A.capas + 0.4, dur: 0.5, desde: { y: 30, blur: 10, s: 0.9 }, curva: 'blando' });
    $('tinte').style.opacity = (0.75 * X.C.suave(X.seg(t, A.curioso - 0.2, A.curioso + 0.3)) * (1 - X.C.suave(X.seg(t, A.bisagra - 0.4, A.bisagra + 0.2)))).toFixed(3);

    // ---- S5: bisagra con engranajes · pico contra gota
    X.anima($('pBisagra'), t, { entra: A.bisagra, dur: 0.5, sale: A.poreso - 0.3, desde: { y: -30, blur: 14, s: 0.9 }, curva: 'blando' });
    const giro = 220 * X.C.inOut(X.seg(t, A.bisagra - 0.3, A.gota + 0.4)) + 8 * t;
    gears.forEach((g, i) => g.setAttribute('transform', `rotate(${((i % 2 ? -1 : 1) * giro).toFixed(2)})`));
    const pP = X.C.inOut(X.seg(t, A.pico - 0.5, A.pico + 0.35)), pG = X.C.inOut(X.seg(t, A.gota - 0.9, A.gota + 0.05));
    pPico.dibuja(pP); pGota.dibuja(pG);
    pPico.pant.setAttribute('stroke', pP > 0.95 ? '#FF5A5F' : '#7FE3FF'); pGota.pant.setAttribute('stroke', pG > 0.95 ? '#5BE49B' : '#7FE3FF');
    chispa.dibuja(t, A.pico + 0.3); ondaGota.dibuja(t, A.gota + 0.05);
    gotaHalo.setAttribute('opacity', (0.8 * X.C.suave(X.seg(t, A.gota, A.gota + 0.4))).toFixed(3));
    X.anima(ePico.g, t, { entra: A.bisagra + 0.4, dur: 0.5, desde: { y: 30, blur: 10, s: 0.9 }, curva: 'blando' });
    X.anima(eGota.g, t, { entra: A.bisagra + 0.55, dur: 0.5, desde: { y: 30, blur: 10, s: 0.9 }, curva: 'blando' });
    X.anima(xPico, t, { entra: A.pico + 0.35, dur: 0.5, desde: { s: 0.3, y: 0, blur: 10 }, curva: 'blando' });
    X.anima(okGota, t, { entra: A.gota + 0.05, dur: 0.5, desde: { s: 0.3, y: 0, blur: 10 }, curva: 'blando' });

    // ---- final
    X.anima($('pFin'), t, { entra: A.abre2 + 0.2, dur: 0.6, desde: { y: -30, blur: 14, s: 0.9 }, curva: 'blando' });

    subs.dibuja(t);
