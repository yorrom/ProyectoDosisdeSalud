</style></head>

    <linearGradient id="g-viga" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C98A6C"/><stop offset=".12" stop-color="#4C4752"/><stop offset="1" stop-color="#26222B"/></linearGradient>

        <path d="M-56 -560 L-92 -548 L-84 -640 L-50 -662 Z"/><path d="M56 -560 L92 -548 L84 -640 L50 -662 Z"/></g>

  <g id="cam">
    <!-- FONDO (lejos): cielo de atardecer, sol, mar, nubes y estrellas. Se mueve menos que la cámara y se desenfoca con el zoom -->

      <g id="humo1"></g><g id="humo2"></g>
      <g id="brazo1f"></g><g id="brazo2f"></g>
      <!-- regla de altura -->
      <g id="medB"><path id="medBl" class="l" d="" style="stroke:#FFF4E8;stroke-width:8"/><text id="medBt" class="wtag ac" font-size="120"></text></g>

        <g id="tSep"><text class="wmono" x="1440" y="-960" font-size="84">SEPARACIÓN</text><text class="wtag ac" x="1440" y="-780" font-size="200">70 KM</text></g>

    <g id="lupaG"></g>

  <!-- giro: plano técnico (sin patas) -->
  <div id="plano"><svg viewBox="0 0 1080 1920">
    <defs><pattern id="p-bp" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0 L0 0 L0 60" fill="none" stroke="rgba(190,220,255,.13)" stroke-width="2"/></pattern>
      <radialGradient id="g-bp" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#1D5A9C"/><stop offset="1" stop-color="#0A2546"/></radialGradient></defs>

    <g transform="translate(540 1290)"><g id="bpCruz"><path d="M-210 -170 L210 170 M210 -170 L-210 170" stroke="#FF5A5F" stroke-width="30" stroke-linecap="round"/></g></g>

  <div id="titular" class="titular" style="top:170px">¿Cómo se atrapa<br><em>un cohete</em>?</div>

  <div id="cSuper" class="callout" style="left:70px;top:1190px"><span class="dot" style="background:var(--acento);color:var(--acento)"></span><div><small>EL PROPULSOR</small>SUPER HEAVY</div></div>

  <div id="cSal" class="callout" style="left:540px;top:1090px"><span class="dot" style="background:var(--acento);color:var(--acento)"></span><div><small>SE APOYA EN</small>SALIENTES</div></div>
  <div id="cAle" class="callout" style="left:70px;top:620px"><span class="dot" style="background:#9AD3FF;color:#9AD3FF"></span><div><small>JUNTO A LAS</small>ALETAS</div></div>
  <div id="eReuso" class="estado" style="top:190px;border-color:var(--ok);color:#9CF2C3">↻ LISTO PARA VOLAR</div>

    <div class="big" style="margin-top:8px">13 OCT <span style="color:var(--acento)">2024</span></div>
  </div>

  <div id="subs"></div>
  <div id="barra" class="progreso"></div>
</div>
<script>
X.listo(() => {
  const $ = (id) => document.getElementById(id), NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, at, padre) => { const e = document.createElementNS(NS, tag); Object.entries(at).forEach(([k, v]) => e.setAttribute(k, v)); if (padre) padre.appendChild(e); return e; };
  const svg = $('mundo-svg');
  X.defs(svg); X.materiales(svg);

  // ---------- el sitio: estrellas, reflejo del sol, nubes ----------
  const az = X.azar(7);
  for (let i = 0; i < 160; i++) { const y = -7000 + az() * 6400; mk('circle', { cx: -3000 + az() * 8000, cy: y, r: 2 + az() * 4.5, fill: '#FFF', opacity: (0.25 + az() * 0.6) * X.limita((-800 - y) / 2500) }, $('estrellas')); }
  for (let i = 0; i < 14; i++) mk('rect', { x: 160 - 60 - az() * 160 + i * 6, y: 2412 + i * 14, width: 120 + az() * 220 - i * 6, height: 5, rx: 2.5 }, $('reflejo'));
  const nube = (padre, cx, cy, w, sem, op = 1) => { const r = X.azar(sem), g = mk('g', { opacity: op, style: 'filter:blur(7px)' }, padre);
    for (let k = 0; k < 7; k++) mk('ellipse', { cx: cx + (r() - 0.5) * w, cy: cy + (r() - 0.5) * w * 0.12, rx: w * (0.16 + r() * 0.2), ry: w * (0.05 + r() * 0.06), fill: 'url(#g-nube)' }, g); return g; };
  [[-600, 1900, 1400, 1, .9], [1500, 1750, 1600, 2, .85], [400, 1350, 1100, 3, .7], [2400, 1250, 1200, 4, .7], [-1200, 900, 1300, 5, .55], [1100, 650, 1500, 6, .5],
   [2600, 300, 1400, 7, .45], [-500, -200, 1600, 8, .35], [1800, -900, 1500, 9, .3]].forEach(([x, y, w, s, o]) => nube($('nubesLejos'), x, y, w, s, o));

        llama($('icoBl'), t, 300, X.seg(t, A.vuelta, A.vuelta + 0.3) * 0.9, 3);
        $('icoB').style.opacity = 1 - X.seg(t, A.frenando, A.frenando + 0.5);
      }
      flechaR.dibuja(t, A.vuelta + 0.3, 1.0);
      ondaSep.dibuja(t, A.suelta + 0.05);
      X.anima($('tSep'), t, { entra: A.suelta + 0.1, dur: 0.6, sale: A.frenando - 0.3, desde: { x: -40, y: 0, blur: 14 }, curva: 'blando' });

      X.anima($('tProp'), t, { entra: A.vuelta + 0.2, dur: 0.6, sale: A.frenando + 0.2, desde: { y: 30, blur: 14 }, curva: 'blando' });
    }

    // ---- callouts y tarjetas ----
    X.anima($('titular'), t, { entra: -1, dur: 0.6, sale: A.torre - 0.3, desde: { y: -40, blur: 18, s: 0.94 }, curva: 'firme' });

    X.anima($('cStack'), t, { entra: A.starship - 0.1, dur: 0.65, sale: A.despega - 0.1, desde: { x: -60, y: 0, blur: 16, s: 0.92 }, curva: 'firme' });
    $('stackHi').style.opacity = (0.5 + 0.5 * Math.sin(t * 7)).toFixed(3);
    X.anima($('eAlt'), t, { entra: A.frenando - 0.1, dur: 0.5, sale: A.quieto + 0.6, desde: { y: -30, blur: 12 }, curva: 'firme' });
    contAlt.dibuja(t, A.frenando, A.quieto - A.frenando + 0.4);
    X.anima($('cPalillos'), t, { entra: A.palillos - 0.05, dur: 0.6, sale: A.colgado - 0.2, desde: { x: -60, y: 0, blur: 14, s: 0.9 }, curva: 'blando' });
    // lupa sobre el saliente que se apoya en el brazo
    const la = X.C.natural(X.seg(t, A.salientes - 0.15, A.salientes + 0.5)) * (1 - X.C.inOut(X.seg(t, A.aterriza - 0.85, A.aterriza - 0.45)));
    lupa.el.style.display = la > 0.01 ? '' : 'none';
    if (la > 0.01) lupa.dibuja(t, { x: 870, y: 950, mira: [868, armY - 6], z: 2.6, a: la });
    X.anima($('cSal'), t, { entra: A.salientes + 0.1, dur: 0.6, sale: A.aterriza - 0.75, desde: { y: 30, blur: 14, s: 0.9 }, curva: 'blando' });
    X.anima($('cAle'), t, { entra: A.aletas, dur: 0.6, sale: A.aterriza - 0.75, desde: { x: -60, y: 0, blur: 14, s: 0.9 }, curva: 'blando' });

    // ---- giro: el plano técnico se abre en círculo ----
    const pa = X.C.inOut(X.seg(t, A.aterriza - 0.35, A.aterriza + 0.35)) * (1 - X.C.inOut(X.seg(t, A.vuelve - 0.3, A.vuelve + 0.35)));
    $('plano').style.clipPath = `circle(${(pa * 1250).toFixed(1)}px at 50% 45%)`; $('plano').style.display = pa > 0.001 ? '' : 'none';
    if (pa > 0.001) {
      document.querySelectorAll('#bpPatas path').forEach((p, i) => X.traza(p, t, A.patas - 0.1 + i * 0.08, 0.6, 'out', A.sin));
      X.anima($('bpPesoIn'), t, { entra: A.pesan - 0.15, dur: 0.6, sale: A.sin, desde: { y: -380, s: 1, o: 1, blur: 10 }, curva: 'blando' });

      const hb = 680 * X.C.natural(X.seg(t, A.carga - 0.1, A.carga + 0.7));
      $('bpBarra').setAttribute('y', (1294 - hb).toFixed(1)); $('bpBarra').setAttribute('height', hb.toFixed(1));
    }
    // ---- vuelve a volar ----
    flechaV.dibuja(t, A.volar - 0.2, 1.1, A.octubre - 0.2);
    ondaCarga.dibuja(t, A.volar + 0.9);
    X.anima($('eReuso'), t, { entra: A.volar, dur: 0.55, sale: A.octubre - 0.3, desde: { y: -30, blur: 12 }, curva: 'firme' });
    X.anima($('cFecha'), t, { entra: A.octubre - 0.1, dur: 0.7, sale: A.ahora - 0.25, desde: { y: -50, blur: 20, s: 0.94 }, curva: 'firme' }); dest.dibuja(t, A.octubre + 0.4, 0.9);
    X.anima($('tFinal'), t, { entra: A.ahora, dur: 0.6, desde: { y: -40, blur: 18, s: 0.94 }, curva: 'firme' });

    subs.dibuja(t);
  };
